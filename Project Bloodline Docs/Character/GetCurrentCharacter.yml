info:
  name: GetCurrentCharacter
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/characters/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example unauth
    request:
      url: "{{baseUrl}}/characters/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-length
          value: "0"
        - name: date
          value: Wed, 15 Jul 2026 04:55:25 GMT
        - name: server
          value: Kestrel
        - name: www-authenticate
          value: Bearer error="invalid_token"
      body:
        type: text
        data: ""
  - name: example success
    request:
      url: "{{baseUrl}}/characters/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Wed, 15 Jul 2026 04:56:13 GMT
        - name: server
          value: Kestrel
        - name: transfer-encoding
          value: chunked
      body:
        type: json
        data: |-
          {
            "id": "bce47713-0fb3-4977-acfa-44e5949f3bc6",
            "name": "Draven",
            "faction": "vampire",
            "level": 1,
            "experience": 0,
            "gold": 0,
            "energy": 90,
            "maxEnergy": 100,
            "strength": 10,
            "defense": 9,
            "agility": 12,
            "createdAtUtc": "2026-07-03T03:07:59.453438+00:00"
          }
