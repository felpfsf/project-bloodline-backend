info:
  name: Logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example success
    request:
      url: "{{baseUrl}}/auth/logout"
      method: POST
    response:
      status: 204
      statusText: No Content
      headers:
        - name: date
          value: Wed, 15 Jul 2026 04:55:00 GMT
        - name: server
          value: Kestrel
      body:
        type: text
        data: ""
