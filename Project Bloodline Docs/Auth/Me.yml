info:
  name: Me
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Mon, 29 Jun 2026 16:01:55 GMT
        - name: server
          value: Kestrel
        - name: transfer-encoding
          value: chunked
      body:
        type: json
        data: |-
          {
            "userID": "6f738755-a06b-4d42-bd85-707bf5433da2"
          }
  - name: example unauth
    request:
      url: "{{baseUrl}}/auth/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-length
          value: "0"
        - name: date
          value: Mon, 29 Jun 2026 16:14:56 GMT
        - name: server
          value: Kestrel
        - name: www-authenticate
          value: Bearer
      body:
        type: text
        data: ""
