info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "felipe1@email.com",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("bearerToken", res.body.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example already exists
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}",
            "password": "{{password}}"
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Mon, 29 Jun 2026 16:04:04 GMT
        - name: server
          value: Kestrel
        - name: transfer-encoding
          value: chunked
      body:
        type: json
        data: |-
          {
            "code": "email_already_exists",
            "message": "A user with the provided email already exists."
          }
  - name: example success
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "felipe1@email.com",
            "password": "{{password}}"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Mon, 29 Jun 2026 16:06:39 GMT
        - name: server
          value: Kestrel
        - name: location
          value: /api/users/c17da286-4c41-47a0-8cc9-276fbc4b6e7e
        - name: transfer-encoding
          value: chunked
      body:
        type: json
        data: |-
          {
            "userId": "c17da286-4c41-47a0-8cc9-276fbc4b6e7e",
            "email": "felipe1@email.com",
            "createdAtUtc": "2026-06-29T16:06:40.201704+00:00"
          }
