services:
  postgres:
    image: postgres:17-alpine
    container_name: bloodline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bloodline
      POSTGRES_USER: bloodline
      POSTGRES_PASSWORD: bloodline_dev
    ports:
      - "5432:5432"
    volumes:
      - bloodline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bloodline -d bloodline
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: bloodline-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "bloodline_dev"
    ports:
      - "5341:80"
      - "5342:5341"
    volumes:
      - bloodline-seq-data:/data

  redis:
    image: redis:7-alpine
    container_name: bloodline-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bloodline-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bloodline-postgres-data:
  bloodline-seq-data:
  bloodline-redis-data:
